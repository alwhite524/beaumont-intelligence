# Copy to wrangler.budget.toml for a deliberate Workers deployment.
name = "beaumont-budget-questions"
main = "server/budget-worker.mjs"
compatibility_date = "2026-10-24"

[assets]
directory = "./docs"
binding = "ASSETS"
run_worker_first = ["/api/budget-ask"]

[vars]
BUDGET_AI_ENABLED = "false"
# Set OPENAI_MODEL to a model available to your API project that supports
# Responses API structured outputs. Store OPENAI_API_KEY with wrangler secret.

[[ratelimits]]
name = "BUDGET_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 6, period = 60 }

[[ratelimits]]
name = "BUDGET_GLOBAL_LIMITER"
namespace_id = "1002"
simple = { limit = 60, period = 60 }
